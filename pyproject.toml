[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "development-war"
version = "0.1.0"
description = "Experimental multi-agent simulation of technological development under resource constraints and incomplete information."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
development-war = "development_war.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
development_war = ["scenarios/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
